---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Renovate Webhook"

on:
  push:
    branches: ["main"]
    paths:
      - .renovaterc.json5
      - "**/**.json"
      - "**/**.json5"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBHOOK_URL: https://renovate-webhook.plexuz.xyz/webhook/v1/schedule
  WEBHOOK_NAMESPACE: ci
  WEBHOOK_JOB: github

jobs:
  webhook:
    name: Trigger Renovate Operator
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions: {}
    steps:
      - name: Schedule all projects of the job
        shell: bash
        env:
          WEBHOOK_TOKEN: ${{ secrets.RENOVATE_OPERATOR_WEBHOOK }}
        run: |
          if [ -z "${WEBHOOK_TOKEN}" ]; then
            echo "::error::RENOVATE_OPERATOR_WEBHOOK secret is not set"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            "${WEBHOOK_URL}?all=true&namespace=${WEBHOOK_NAMESPACE}&job=${WEBHOOK_JOB}"
